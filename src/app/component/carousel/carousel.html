<div class="bb-carousel">

  <!-- Slides -->
  @for (slide of slides; track slide.title; let i = $index) {
    <div class="carousel-slide" [class.active]="i === currentSlide">
      <!-- Background Image -->
      <div class="slide-bg" [style.backgroundImage]="'url(' + slide.image + ')'"></div>
      <!-- Overlay -->
      <div class="slide-overlay"></div>
      <!-- Content -->
      <div class="slide-content" [class.animate]="i === currentSlide">
        <span class="slide-badge">{{ slide.badge }}</span>
        <h1 class="slide-title">{{ slide.title }}</h1>
        <p class="slide-subtitle">{{ slide.subtitle }}</p>
        <a [routerLink]="slide.ctaLink" class="slide-cta">
          {{ slide.cta }} <i class="fa-solid fa-arrow-right"></i>
        </a>
      </div>
    </div>
  }

  <!-- Prev / Next Controls -->
  <button class="carousel-control prev" (click)="prevSlide()" aria-label="Previous slide">
    <i class="fa-solid fa-chevron-left"></i>
  </button>
  <button class="carousel-control next" (click)="nextSlide()" aria-label="Next slide">
    <i class="fa-solid fa-chevron-right"></i>
  </button>

  <!-- Dot Indicators -->
  <div class="carousel-dots">
    @for (slide of slides; track slide.title; let i = $index) {
      <button
        class="dot"
        [class.active]="i === currentSlide"
        (click)="goTo(i)"
        [attr.aria-label]="'Go to slide ' + (i + 1)">
      </button>
    }
  </div>

</div>
